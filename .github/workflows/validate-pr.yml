name: Validate pull requests
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build chapter archive
        run: python scripts/build_site.py
      - name: Refresh generated Fashion inventory
        run: python scripts/build_inventory.py --chapter fashion
      - name: JavaScript syntax
        run: node --check chapters/fashion/web/assets/chapter.js
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Check site and download links
        run: python scripts/check_site.py
